<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="container mt-5">

        <h2 class="mb-4">Bootstrap Form</h2>

        <form>

            <!-- Email -->
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">
                    Email address
                </label>

                <input type="email"
                       class="form-control"
                       id="exampleInputEmail1"
                       aria-describedby="emailHelp">

                <div id="emailHelp" class="form-text">
                    We'll never share your email with anyone else.
                </div>
            </div>


            <!-- Password -->
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">
                    Password
                </label>

                <input type="password"
                       class="form-control form-control-sm"
                       id="exampleInputPassword1">
            </div>


            <!-- Checkbox -->
            <div class="mb-3 form-check">
                <input type="checkbox"
                       class="form-check-input"
                       id="exampleCheck1">

                <label class="form-check-label" for="exampleCheck1">
                    Check me out
                </label>
            </div>


            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary">
                Submit
            </button>


            <!-- Comments -->
            <div class="mb-3 mt-3">
                <label for="comments" class="form-label">
                    Comments
                </label>

                <textarea class="form-control"
                          id="comments"
                          rows="3"></textarea>
            </div>


            <!-- First Name, Last Name and Email -->
            <div class="row mb-3">

                <div class="col">
                    <label for="firstName" class="form-label">
                        First name
                    </label>

                    <input type="text"
                           class="form-control form-control-sm"
                           placeholder="First name"
                           id="firstName">
                </div>

                <div class="col">
                    <label for="lastName" class="form-label">
                        Last name
                    </label>

                    <input type="text"
                           class="form-control"
                           placeholder="Last name"
                           id="lastName">
                </div>

                <div class="col">
                    <label for="email" class="form-label">
                        Email
                    </label>

                    <input type="email"
                           class="form-control"
                           placeholder="Email"
                           id="email">
                </div>

            </div>


            <!-- Select Menu -->
            <div class="mb-3">
                <label for="browser" class="form-label">
                    Choose your browser
                </label>

                <select class="form-select form-select-lg"
                        id="browser"
                        aria-label="Default select example">

                    <option selected>
                        Open this select menu
                    </option>

                    <option value="1">Google Chrome</option>
                    <option value="2">Mozilla Firefox</option>
                    <option value="3">Microsoft Edge</option>

                </select>
            </div>


            <!-- Radio Buttons -->
            <div class="mb-3">

                <label class="form-label">
                    Choose an option
                </label>

                <div class="form-check">
                    <input type="radio"
                           class="form-check-input"
                           id="exampleRadio1"
                           name="exampleRadio">

                    <label class="form-check-label" for="exampleRadio1">
                        Radio button 1
                    </label>
                </div>

                <div class="form-check">
                    <input type="radio"
                           class="form-check-input"
                           id="exampleRadio2"
                           name="exampleRadio">

                    <label class="form-check-label" for="exampleRadio2">
                        Radio button 2
                    </label>
                </div>

            </div>


            <!-- Range -->
            <div class="mb-3">

                <label for="exampleRange" class="form-label">
                    Example range
                </label>

                <input type="range"
                       class="form-range"
                       id="exampleRange">

            </div>


            <!-- Switch -->
            <div class="form-check form-switch mb-3">

                <input class="form-check-input"
                       type="checkbox"
                       id="flexSwitchCheckDefault">

                <label class="form-check-label"
                       for="flexSwitchCheckDefault">
                    Default switch checkbox input
                </label>

            </div>

        </form>

    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Form Components</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <form>

            <!-- Radio Buttons -->
            <div class="form-check">

                <input type="radio"
                       class="form-check-input"
                       id="exampleRadio1"
                       name="exampleRadio">

                <label class="form-check-label" for="exampleRadio1">
                    Radio button 1
                </label>

            </div>

            <div class="form-check">

                <input type="radio"
                       class="form-check-input"
                       id="exampleRadio2"
                       name="exampleRadio">

                <label class="form-check-label" for="exampleRadio2">
                    Radio button 2
                </label>

            </div>


            <!-- Range -->
            <div class="mt-3">

                <label for="exampleRange" class="form-label">
                    Example range
                </label>

                <input type="range"
                       class="form-range"
                       id="exampleRange">

            </div>


            <!-- Switch -->
            <div class="form-check form-switch mt-3">

                <input class="form-check-input"
                       type="checkbox"
                       id="flexSwitchCheckDefault">

                <label class="form-check-label"
                       for="flexSwitchCheckDefault">
                    Default switch checkbox input
                </label>

            </div>


            <!-- Input Group with @ -->
            <div class="input-group mb-3 mt-4">

                <span class="input-group-text"
                      id="inputGroup-sizing-default">
                    @
                </span>

                <input type="text"
                       class="form-control"
                       aria-label="Default"
                       aria-describedby="inputGroup-sizing-default">

            </div>


            <!-- Email Input Group -->
            <div class="input-group">

                <input type="text"
                       class="form-control"
                       placeholder="Your Email">

                <span class="input-group-text">
                    @example.com
                </span>

            </div>

        </form>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Hide Text</title>
</head>
<body>
    <p id="text">This is a paragraph that will be hidden when the button is clicked.</p>
    <button id="hideButton">Hide Text</button>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $("#hideButton").click(function() {
                $("#text").hide();
            });
        });
    </script>
</body>
</html>
