<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix</title>
  <link rel="icon" href="https://assets.nflxext.com/us/ffe/siteui/common/icons/nficon2016.ico" />
  <link rel="stylesheet" href="../css/profiles.css" />
</head>
<body>
  <div class="profiles-page">
    <h1>Who's watching?</h1>
    <div class="profiles-list">
      <a href="browse.html" class="profile">
        <div class="avatar" style="background:#e50914"><img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="" /></div>
        <span>User 1</span>
      </a>
      <a href="browse.html" class="profile">
        <div class="avatar" style="background:#2196f3"><img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="" style="filter:hue-rotate(180deg)" /></div>
        <span>User 2</span>
      </a>
      <a href="browse.html" class="profile">
        <div class="avatar" style="background:#4caf50"><img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="" style="filter:hue-rotate(90deg)" /></div>
        <span>Kids</span>
      </a>
      <a href="#" class="profile add">
        <div class="avatar add-avatar"><i class="fas fa-plus"></i></div>
        <span>Add Profile</span>
      </a>
    </div>
    <a href="#" class="manage-btn">Manage Profiles</a>
  </div>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</body>
</html>
