<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h1 align="center">Student Registration Form</h1>
    <h3 align="center">College Name</h3>

    <form>

        <label>Student Name:</label><br>
        <input type="text" name="student_name" required><br><br>

        <label>Father's Name:</label><br>
        <input type="text" name="father_name" required><br><br>

        <label>Mother's Name:</label><br>
        <input type="text" name="mother_name" required><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Phone:</label><br>
        <input type="tel" name="phone" required><br><br>

        <label>Date of Birth:</label><br>
        <input type="date" name="dob" required><br><br>

        <label>Password:</label><br>
        <input type="password" name="password" required><br><br>

        <label>Personal Website:</label><br>
        <input type="url" name="website" placeholder="https://example.com"><br><br>

        <label>Upload Photograph:</label><br>
        <input type="file" name="photo" accept="image/*"><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br><br>

        <label>Hobbies:</label><br>
        <input type="checkbox" name="hobby" value="Reading"> Reading
        <input type="checkbox" name="hobby" value="Sports"> Sports
        <input type="checkbox" name="hobby" value="Music"> Music
        <input type="checkbox" name="hobby" value="Traveling"> Traveling
        <br><br>

        <label>Select Course:</label><br>
        <select name="course">
            <option value="">--Select Course--</option>
            <option>BCA</option>
            <option>BBA</option>
            <option>B.Sc</option>
            <option>B.Com</option>
            <option>BA</option>
            <option>MCA</option>
            <option>MBA</option>
        </select>
        <br><br>

        <label>Skills:</label><br>
        <input type="checkbox" name="skill" value="HTML"> HTML
        <input type="checkbox" name="skill" value="CSS"> CSS
        <input type="checkbox" name="skill" value="JavaScript"> JavaScript
        <input type="checkbox" name="skill" value="C"> C
        <input type="checkbox" name="skill" value="Java"> Java
        <br><br>

        <label>Address:</label><br>
        <textarea name="address" rows="4" cols="40"></textarea>
        <br><br>

        <input type="submit" value="Register Student">
        <input type="reset" value="Clear">

    </form>

</body>
</html>
