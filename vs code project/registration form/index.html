<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="form-box">

            <h1>Student Registration Form</h1>
            <p class="subtitle">Please fill in the details below to register</p>

            <form>

                <!-- Personal Information -->
                <h2>Personal Information</h2>

                <div class="form-row">

                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname"
                               placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="studentid">Student ID</label>
                        <input type="text" id="studentid" name="studentid"
                               placeholder="Enter student ID" required>
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="text" id="dob" name="dob"
                               placeholder="dd-mm-yyyy" required>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender">
                            <option value="Male" selected>Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email"
                               placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="mobile">Mobile Number</label>
                        <input type="tel" id="mobile" name="mobile"
                               placeholder="Enter mobile number" required>
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="mother">Mother's Name</label>
                        <input type="text" id="mother" name="mother"
                               placeholder="Enter mother's name">
                    </div>

                    <div class="form-group">
                        <label for="father">Father's Name</label>
                        <input type="text" id="father" name="father"
                               placeholder="Enter father's name">
                    </div>

                </div>

                <div class="form-group">
                    <label for="portfolio">Personal Portfolio</label>
                    <input type="url" id="portfolio" name="portfolio"
                           placeholder="https://">
                </div>


                <!-- Academic Information -->
                <h2>Academic Information</h2>

                <div class="form-row">

                    <div class="form-group">
                        <label for="course">Course</label>
                        <select id="course" name="course">
                            <option value="BCA" selected>BCA</option>
                            <option value="BBA">BBA</option>
                            <option value="B.Com">B.Com</option>
                            <option value="B.Sc">B.Sc</option>
                            <option value="MCA">MCA</option>
                            <option value="MBA">MBA</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" name="department"
                               placeholder="Enter department">
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="semester">Year / Semester</label>
                        <input type="text" id="semester" name="semester"
                               placeholder="e.g. 2nd Year / 4th Semester">
                    </div>

                    <div class="form-group">
                        <label for="roll">Roll Number</label>
                        <input type="text" id="roll" name="roll"
                               placeholder="Enter roll number">
                    </div>

                </div>

                <div class="form-group">
                    <label for="admission">Admission Year</label>
                    <input type="number" id="admission" name="admission"
                           placeholder="e.g. 2025" min="2000" max="2100">
                </div>


                <!-- Account Information -->
                <h2>Account Information</h2>

                <div class="form-row">

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username"
                               placeholder="Create a username" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password"
                               placeholder="Create a password" required>
                    </div>

                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password"
                           name="confirm-password"
                           placeholder="Confirm your password" required>
                </div>


                <!-- Additional Information -->
                <h2>Additional Information</h2>

                <div class="form-group">
                    <label for="hobbies">Hobbies</label>
                    <input type="text" id="hobbies" name="hobbies"
                           placeholder="Reading, Music">
                </div>

                <div class="form-group">
                    <label for="skills">Skills</label>
                    <input type="text" id="skills" name="skills"
                           placeholder="HTML, CSS">
                </div>

                <div class="form-group">
                    <label for="photo">Passport-size Photo</label>
                    <input type="file" id="photo" name="photo"
                           accept="image/*">
                </div>


                <!-- Buttons -->
                <div class="button-group">
                    <button type="reset" class="reset-btn">Reset</button>
                    <button type="submit" class="submit-btn">Register</button>
                </div>

            </form>

        </div>

    </div>

</body>
</html>
