<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Campus Connect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">


<!-- NAVBAR -->

<nav class="navbar bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold text-primary fs-4"
           href="index.html">
            🎓 Campus Connect
        </a>

        <a href="login.html"
           class="btn btn-outline-primary">
            Login
        </a>

    </div>

</nav>


<!-- SIGNUP -->

<div class="container py-5">

    <div class="auth-card">

        <div class="text-center mb-4">

            <div class="auth-icon">
                <i class="bi bi-person-plus"></i>
            </div>

            <h2 class="fw-bold mt-3">
                Create Your Account
            </h2>

            <p class="text-secondary">
                Join your college community
            </p>

        </div>


        <form id="signupForm">


            <!-- PERSONAL INFORMATION -->

            <h5 class="section-title">
                Personal Information
            </h5>

            <div class="row g-3">

                <div class="col-md-6">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input type="text"
                           class="form-control"
                           id="fullName"
                           placeholder="Enter your full name"
                           required>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Student ID
                    </label>

                    <input type="text"
                           class="form-control"
                           id="studentId"
                           placeholder="e.g. STU2026001"
                           required>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        College Email
                    </label>

                    <input type="email"
                           class="form-control"
                           id="email"
                           placeholder="student@college.edu"
                           required>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Mobile Number
                    </label>

                    <input type="tel"
                           class="form-control"
                           id="mobile"
                           placeholder="Enter mobile number"
                           required>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Date of Birth
                    </label>

                    <input type="date"
                           class="form-control"
                           required>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Gender
                    </label>

                    <select class="form-select">

                        <option selected>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                        <option>Prefer not to say</option>

                    </select>

                </div>

            </div>


            <!-- COLLEGE INFORMATION -->

            <h5 class="section-title mt-4">
                College Information
            </h5>

            <div class="row g-3">

                <div class="col-md-6">

                    <label class="form-label">
                        Course
                    </label>

                    <select class="form-select" required>

                        <option selected disabled>
                            Select Course
                        </option>

                        <option>BCA</option>
                        <option>MCA</option>
                        <option>BBA</option>
                        <option>MBA</option>
                        <option>B.Tech</option>
                        <option>M.Tech</option>
                        <option>B.Sc</option>
                        <option>M.Sc</option>

                    </select>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Department
                    </label>

                    <select class="form-select" required>

                        <option selected disabled>
                            Select Department
                        </option>

                        <option>Computer Science</option>
                        <option>Information Technology</option>
                        <option>Commerce</option>
                        <option>Management</option>
                        <option>Science</option>
                        <option>Arts</option>

                    </select>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Year
                    </label>

                    <select class="form-select">

                        <option>1st Year</option>
                        <option>2nd Year</option>
                        <option>3rd Year</option>
                        <option>4th Year</option>

                    </select>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Division
                    </label>

                    <input type="text"
                           class="form-control"
                           placeholder="e.g. A">

                </div>

            </div>


            <!-- PROFILE -->

            <h5 class="section-title mt-4">
                Profile
            </h5>

            <div class="mb-3">

                <label class="form-label">
                    Profile Picture
                </label>

                <input type="file"
                       class="form-control"
                       accept="image/*">

            </div>


            <!-- ACCOUNT -->

            <h5 class="section-title mt-4">
                Account Security
            </h5>

            <div class="row g-3">

                <div class="col-md-6">

                    <label class="form-label">
                        Password
                    </label>

                    <input type="password"
                           class="form-control"
                           id="password"
                           placeholder="Create password"
                           required>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Confirm Password
                    </label>

                    <input type="password"
                           class="form-control"
                           id="confirmPassword"
                           placeholder="Confirm password"
                           required>

                </div>

            </div>


            <div class="form-check mt-4">

                <input class="form-check-input"
                       type="checkbox"
                       id="terms"
                       required>

                <label class="form-check-label">
                    I agree to the Campus Connect
                    <a href="#">Terms & Privacy Policy</a>.
                </label>

            </div>


            <button type="submit"
                    class="btn btn-primary w-100 btn-lg mt-4">

                Create Account

            </button>


            <p class="text-center text-secondary mt-4">

                Already have an account?

                <a href="login.html"
                   class="text-primary fw-semibold">
                    Login
                </a>

            </p>

        </form>

    </div>

</div>


<script src="javascript.js"></script>

</body>
</html>
